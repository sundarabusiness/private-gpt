# D7 Wash Empire PrivateGPT profile.
# Purpose: govt-api-grounding collection for car wash land sniper grounding only.
# Path B substitution: Ollama Gemma is the local grounding LLM until the full
# Microsoft BitNet backend is deployed. This follows the v2 plan Phase 9 risk
# table: BitNet unavailable -> local Ollama small-model substitute.

server:
  env_name: ${APP_ENV:d7-bitnet}
  port: ${PORT:8000}
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]
  auth:
    enabled: false

data:
  local_ingestion:
    enabled: true
    allow_ingest_from:
      - "C:/wash-empire/privategpt-ingest"
  local_data_folder: local_data/d7_privategpt

ui:
  enabled: false
  path: /
  default_mode: "RAG"
  default_chat_system_prompt: >
    You are a zero-hallucination grounding engine. ONLY return verbatim excerpts
    from ingested official API docs, data dictionaries, and past sniper logs.
  default_query_system_prompt: >
    You can only answer using the provided context. If the answer is not in
    context, return EMPTY.
  default_summarization_system_prompt: >
    Return only source-backed excerpts.
  delete_file_button_enabled: false
  delete_all_files_button_enabled: false

llm:
  mode: ollama
  prompt_style: "llama3"
  max_new_tokens: 1024
  context_window: 4096
  tokenizer: google/gemma-2b-it
  temperature: 0.0

embedding:
  mode: ollama
  ingest_mode: simple
  embed_dim: 768

huggingface:
  embedding_hf_model_name: nomic-ai/nomic-embed-text-v1.5
  access_token: ${HF_TOKEN:}
  trust_remote_code: true

openai:
  # Legacy OpenAI-like settings are kept for compatibility checks. The active
  # Path B runtime below uses the `ollama` section.
  api_base: ${OLLAMA_OPENAI_BASE:http://127.0.0.1:11434/v1}
  api_key: ${OLLAMA_OPENAI_API_KEY:EMPTY}
  model: ${OLLAMA_MODEL:gemma3:4b}
  request_timeout: 600.0
  embedding_api_base: ${OLLAMA_OPENAI_BASE:http://127.0.0.1:11434/v1}
  embedding_api_key: ${OLLAMA_OPENAI_API_KEY:EMPTY}
  embedding_model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

ollama:
  api_base: ${OLLAMA_BASE:http://127.0.0.1:11434}
  embedding_api_base: ${OLLAMA_BASE:http://127.0.0.1:11434}
  llm_model: ${OLLAMA_MODEL:gemma3:4b}
  embedding_model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}
  keep_alive: 5m
  tfs_z: 1.0
  top_k: 40
  top_p: 0.9
  repeat_last_n: 64
  repeat_penalty: 1.1
  request_timeout: 600.0
  autopull_models: false

vectorstore:
  database: qdrant

qdrant:
  path: local_data/d7_privategpt/qdrant
  collection_name: govt-api-grounding

nodestore:
  database: simple

rag:
  similarity_top_k: 8
  similarity_value: 0.45
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-2-v2
    top_n: 4

summarize:
  use_async: true

