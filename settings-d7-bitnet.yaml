# D7 Wash Empire PrivateGPT profile.
# Purpose: govt-api-grounding collection for car wash land sniper grounding only.

server:
  env_name: ${APP_ENV:d7-bitnet}
  port: ${PORT:8000}
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]
  auth:
    enabled: false

data:
  local_ingestion:
    enabled: true
    allow_ingest_from:
      - "C:/wash-empire/privategpt-ingest"
  local_data_folder: local_data/d7_privategpt

ui:
  enabled: false
  path: /
  default_mode: "RAG"
  default_chat_system_prompt: >
    You are a zero-hallucination grounding engine. ONLY return verbatim excerpts
    from ingested official API docs, data dictionaries, and past sniper logs.
  default_query_system_prompt: >
    You can only answer using the provided context. If the answer is not in
    context, return EMPTY.
  default_summarization_system_prompt: >
    Return only source-backed excerpts.
  delete_file_button_enabled: false
  delete_all_files_button_enabled: false

llm:
  mode: openailike
  prompt_style: "llama3"
  max_new_tokens: 1024
  context_window: 4096
  tokenizer: microsoft/BitNet-b1.58-2B-4T
  temperature: 0.0

embedding:
  mode: huggingface
  ingest_mode: simple
  embed_dim: 768

huggingface:
  embedding_hf_model_name: nomic-ai/nomic-embed-text-v1.5
  access_token: ${HF_TOKEN:}
  trust_remote_code: true

openai:
  # BitNet.cpp builds llama-server; run it on 127.0.0.1:8080 and expose its
  # OpenAI-compatible /v1 API here.
  api_base: ${BITNET_OPENAI_BASE:http://127.0.0.1:8080/v1}
  api_key: ${BITNET_OPENAI_API_KEY:EMPTY}
  model: ${BITNET_MODEL:bitnet}
  request_timeout: 600.0
  embedding_api_base: ${BITNET_OPENAI_BASE:http://127.0.0.1:8080/v1}
  embedding_api_key: ${BITNET_OPENAI_API_KEY:EMPTY}
  embedding_model: ${BITNET_EMBEDDING_MODEL:nomic-ai/nomic-embed-text-v1.5}

vectorstore:
  database: qdrant

qdrant:
  path: local_data/d7_privategpt/qdrant
  collection_name: govt-api-grounding

nodestore:
  database: simple

rag:
  similarity_top_k: 8
  similarity_value: 0.45
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-2-v2
    top_n: 4

summarize:
  use_async: true

